<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Over-Time</title>

    <link rel="stylesheet" href="/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./reset-password.js" defer></script>
</head>

<body>

    <main class="reset-password-page">

        <div class="reset-password-card">

            <img src="/icons/icon-192.png" alt="Over-Time logo" class="reset-logo">

            <h1>Set a new password</h1>

            <p>
                Enter and confirm your new password.
            </p>

            <label>
                New Password

                <input type="password" id="newPassword" autocomplete="new-password">
            </label>

            <label>
                Confirm Password

                <input type="password" id="confirmNewPassword" autocomplete="new-password">
            </label>

            <p id="resetMessage" class="form-message"></p>

            <button type="button" id="updatePasswordButton" class="button primary">
                Update Password
            </button>

        </div>

    </main>

</body>

</html>
